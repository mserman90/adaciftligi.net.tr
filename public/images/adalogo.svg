<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;family=Montserrat:wght@800&amp;display=swap');
      .serif-title {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 900;
      }
      .sans-sub {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
      }
    </style>

    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#68A5D0" />
      <stop offset="60%" stopColor="#7FBDE3" />
      <stop offset="100%" stopColor="#9BD2F2" />
    </linearGradient>

    <!-- Pasture Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#6DBA35" />
      <stop offset="35%" stopColor="#489F26" />
      <stop offset="100%" stopColor="#256B1E" />
    </linearGradient>

    <!-- Circle Clip -->
    <clipPath id="circleClip">
      <circle cx="115" cy="100" r="69" />
    </clipPath>
  </defs>

  <!-- ========================================== -->
  <!-- LEFT: OFFICIAL EMBLEM (FULL COLOR MEDALLION) -->
  <!-- ========================================== -->

  <!-- 1. Outer Warm Gold / Tan Border Ring -->
  <circle cx="115" cy="100" r="77" stroke="#B39268" stroke-width="4.5" fill="none" />

  <!-- 2. Pure White Separation Ring -->
  <circle cx="115" cy="100" r="73.5" stroke="#FFFFFF" stroke-width="3" fill="none" />

  <!-- 3. Inner Dark Navy Ring (Enclosure) -->
  <circle cx="115" cy="100" r="70.5" stroke="#0C2340" stroke-width="3.2" fill="#FFFFFF" />

  <!-- Inner Scene Clipped Inside Navy Circle -->
  <g clip-path="url(#circleClip)">
    <!-- Sky Background -->
    <rect x="35" y="20" width="160" height="160" fill="#FFFFFF" />

    
    <!-- HISTORIC MERİÇ STONE BRIDGE                         -->
    
    <g id="meric-bridge">
      <!-- Bridge Stone Abutment & Body -->
      <path
        d="M 38 88 L 192 88 L 192 68 L 38 68 Z"
        fill="#A68C6A"
        stroke="#0C2340"
        stroke-width="2.2"
        stroke-linejoin="round"
      />
      <!-- Bridge Top Parapet Balustrade -->
      <path
        d="M 38 68 L 192 68 L 192 64 L 38 64 Z"
        fill="#BCA482"
        stroke="#0C2340"
        stroke-width="1.8"
      />

      <!-- Central Kitabe Köşkü (Historical Observation Pavilion) -->
      <path
        d="M 108 64 L 108 52 L 115 42 L 122 52 L 122 64 Z"
        fill="#A68C6A"
        stroke="#0C2340"
        stroke-width="2.2"
        stroke-linejoin="round"
      />
      <!-- Pavilion Pitched Roof Eaves -->
      <path
        d="M 105 52 L 115 42 L 125 52 Z"
        fill="#8C7150"
        stroke="#0C2340"
        stroke-width="2"
      />
      <!-- Pavilion Window Arch (Sky behind) -->
      <path
        d="M 112 59 L 112 54 A 3 3 0 0 1 118 54 L 118 59 Z"
        fill="#FFFFFF"
        stroke="#0C2340"
        stroke-width="1.4"
      />
      <!-- Pavilion Gold Finial -->
      <circle cx="115" cy="40.5" r="1.8" fill="#B39268" stroke="#0C2340" stroke-width="1" />

      <!-- 5 Classical Stone Arches (revealing sky/river) -->
      <!-- Arch 1 -->
      <path d="M 45 88 A 7 7 0 0 1 59 88 Z" fill="#FFFFFF" stroke="#0C2340" stroke-width="2" />
      <!-- Arch 2 -->
      <path d="M 68 88 A 9 9 0 0 1 86 88 Z" fill="#FFFFFF" stroke="#0C2340" stroke-width="2" />
      <!-- Arch 3 (Center arch directly under pavilion) -->
      <path d="M 96 88 A 11 11 0 0 1 118 88 Z" fill="#FFFFFF" stroke="#0C2340" stroke-width="2" />
      <!-- Arch 4 -->
      <path d="M 128 88 A 9 9 0 0 1 146 88 Z" fill="#7FBDE3" stroke="#0C2340" stroke-width="2" />
      <!-- Arch 5 -->
      <path d="M 156 88 A 7 7 0 0 1 170 88 Z" fill="#7FBDE3" stroke="#0C2340" stroke-width="2" />

      <!-- Pier Cutwaters (Stone Details) -->
      <line x1="63.5" y1="88" x2="63.5" y2="76" stroke="#0C2340" stroke-width="1.8" />
      <line x1="91" y1="88" x2="91" y2="74" stroke="#0C2340" stroke-width="1.8" />
      <line x1="123" y1="88" x2="123" y2="74" stroke="#0C2340" stroke-width="1.8" />
      <line x1="151" y1="88" x2="151" y2="76" stroke="#0C2340" stroke-width="1.8" />
    </g>

    
    <!-- ROLLING GREEN HILLS & MERİÇ RIVER MEANDER          -->
    
    <!-- Distant Left Hill -->
    <path
      d="M 35 106 Q 75 92 120 102 L 120 170 L 35 170 Z"
      fill="#68B936"
      stroke="#0C2340"
      stroke-width="1.5"
    />

    <!-- Distant Right Hill -->
    <path
      d="M 120 102 Q 155 94 195 100 L 195 170 L 120 170 Z"
      fill="#5BA82D"
      stroke="#0C2340"
      stroke-width="1.5"
    />

    <!-- Winding Meriç River (Flowing from under bridge to lower right) -->
    <path
      d="M 124 88 
         C 134 96, 146 102, 142 114 
         C 136 126, 144 136, 186 150 
         L 128 170 
         C 126 155, 126 142, 134 132 
         C 140 120, 128 108, 114 88 Z"
      fill="url(#riverGrad)"
      stroke="#0C2340"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- White Water Current Ripples -->
    <path
      d="M 134 96 C 141 103, 144 109, 139 116 C 134 123, 142 131, 158 138"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      fill="none"
      opacity="0.9"
    />
    <path
      d="M 132 118 C 137 124, 137 130, 142 136 C 146 142, 156 147, 174 150"
      stroke="#FFFFFF"
      stroke-width="1.8"
      stroke-linecap="round"
      fill="none"
      opacity="0.85"
    />

    <!-- Foreground Lush Pasture -->
    <path
      d="M 35 120 
         C 60 114, 90 116, 115 124 
         C 120 126, 122 138, 118 152 
         C 114 162, 118 170, 120 172 
         L 35 172 Z"
      fill="url(#grassGrad)"
      stroke="#0C2340"
      stroke-width="2"
    />

    <!-- Grass Blades Texture in Foreground -->
    <g stroke="#1A5E16" stroke-width="1.4" stroke-linecap="round">
      <line x1="42" y1="168" x2="44" y2="156" />
      <line x1="45" y1="168" x2="48" y2="158" />
      <line x1="52" y1="170" x2="55" y2="160" />
      <line x1="60" y1="170" x2="62" y2="158" />
      <line x1="65" y1="168" x2="68" y2="157" />
      <line x1="72" y1="170" x2="74" y2="162" />
      <line x1="80" y1="170" x2="82" y2="158" />
      <line x1="86" y1="170" x2="88" y2="160" />
      <line x1="94" y1="170" x2="96" y2="159" />
      <line x1="102" y1="170" x2="105" y2="162" />
      <line x1="110" y1="170" x2="112" y2="163" />
      <line x1="116" y1="170" x2="119" y2="164" />
    </g>

    
    <!-- ANIMALS: HOLSTEIN COW, KIVIRCIK SHEEP, DUCK        -->
    

    <!-- 1. Holstein Dairy Cow -->
    <g id="holstein-cow">
      <!-- White Base Body -->
      <path
        d="M 44 165 L 48 165 L 49 146 L 54 146 L 55 165 L 60 165 L 61 138 
           L 89 138 L 90 165 L 95 165 L 96 144 L 99 144 L 100 165 L 105 165 
           L 106 128 C 106 123, 102 117, 96 115 L 96 109 C 96 104, 91 102, 87 104 
           L 82 106 L 77 104 C 73 102, 69 104, 69 108 L 69 112 
           C 58 112, 48 114, 44 122 C 40 130, 40 144, 44 165 Z"
        fill="#FFFFFF"
        stroke="#0C2340"
        stroke-width="2.6"
        stroke-linejoin="round"
      />
      <!-- Udder -->
      <path d="M 52 142 C 54 147, 58 147, 60 142" fill="#F7D0D4" stroke="#0C2340" stroke-width="1.5" />

      <!-- Horns (Curved Upwards) -->
      <path d="M 80 102 L 83 96 L 86 100" stroke="#0C2340" stroke-width="2.4" fill="#B39268" stroke-linejoin="round" />
      <path d="M 72 102 L 70 96 L 74 99" stroke="#0C2340" stroke-width="2.4" fill="#B39268" stroke-linejoin="round" />

      <!-- Ears with Pink Inside -->
      <ellipse cx="67" cy="107" rx="3.5" ry="2" fill="#FFFFFF" stroke="#0C2340" stroke-width="1.8" transform="rotate(-20 67 107)" />
      <ellipse cx="67" cy="107" rx="2" ry="1" fill="#F7D0D4" transform="rotate(-20 67 107)" />
      <ellipse cx="88" cy="107" rx="3.5" ry="2" fill="#FFFFFF" stroke="#0C2340" stroke-width="1.8" transform="rotate(20 88 107)" />
      <ellipse cx="88" cy="107" rx="2" ry="1" fill="#F7D0D4" transform="rotate(20 88 107)" />

      <!-- Cow Face Details (Big round smiling eye, muzzle) -->
      <circle cx="83" cy="111" r="2.2" fill="#0C2340" />
      <circle cx="83.8" cy="110.2" r="0.8" fill="#FFFFFF" />
      <path d="M 88 114 C 92 115, 93 118, 91 121 C 88 123, 84 122, 82 120" fill="#F7D0D4" stroke="#0C2340" stroke-width="1.8" />
      <circle cx="87" cy="118" r="0.9" fill="#0C2340" />
      <circle cx="90" cy="118.5" r="0.9" fill="#0C2340" />
      <!-- Gentle Smile -->
      <path d="M 84 120 C 86 122, 88 122, 90 120" stroke="#0C2340" stroke-width="1.5" stroke-linecap="round" fill="none" />

      <!-- Black Holstein Patches -->
      <!-- Head / Eye Patch -->
      <path d="M 72 110 C 76 108, 81 110, 81 114 C 80 119, 74 122, 69 119 C 67 116, 68 112, 72 110 Z" fill="#0C2340" />
      <!-- Large Flank Saddle Patch -->
      <path
        d="M 54 119 C 64 117, 72 121, 68 128 C 64 133, 56 132, 51 126 C 49 122, 51 120, 54 119 Z"
        fill="#0C2340"
      />
      <!-- Rear Hip Patch -->
      <path d="M 43 125 C 47 123, 49 128, 48 133 C 45 136, 42 131, 43 125 Z" fill="#0C2340" />
      <!-- Tail -->
      <path d="M 41 129 C 39 135, 40 144, 42 149" stroke="#0C2340" stroke-width="2" stroke-linecap="round" fill="none" />
      <ellipse cx="42.5" cy="150.5" rx="2.5" ry="1.5" fill="#0C2340" />
    </g>

    <!-- 2. Kıvırcık Sheep (In front of cow) -->
    <g id="kivircik-sheep">
      <!-- White Curly Fleece Body -->
      <path
        d="M 64 165 L 67 165 L 68 152 L 72 152 L 73 165 L 77 165 L 78 148 
           L 86 148 L 87 165 L 91 165 L 92 150 L 96 150 L 97 165 L 101 165 
           L 102 142 
           C 102 139, 100 137, 102 134 
           C 104 131, 102 126, 98 126 
           C 96 124, 94 124, 92 126 
           C 89 123, 85 123, 82 125 
           C 79 123, 75 124, 73 126 
           C 68 126, 66 130, 65 134 
           C 63 138, 63 146, 64 165 Z"
        fill="#FFFFFF"
        stroke="#0C2340"
        stroke-width="2.4"
        stroke-linejoin="round"
      />
      <!-- Wool Fluff Scallops -->
      <path d="M 70 133 C 72 130, 76 131, 77 134" stroke="#0C2340" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <path d="M 78 131 C 81 129, 85 130, 86 133" stroke="#0C2340" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <path d="M 72 140 C 75 138, 79 139, 80 142" stroke="#0C2340" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <path d="M 82 138 C 85 136, 89 137, 90 140" stroke="#0C2340" stroke-width="1.6" stroke-linecap="round" fill="none" />

      <!-- Sheep Head & Ears -->
      <path
        d="M 94 130 C 99 128, 104 131, 104 135 C 104 138, 99 140, 95 138 Z"
        fill="#FFFFFF"
        stroke="#0C2340"
        stroke-width="2.2"
      />
      <!-- Eye & Snout -->
      <circle cx="100" cy="133" r="1.6" fill="#0C2340" />
      <circle cx="100.5" cy="132.5" r="0.6" fill="#FFFFFF" />
      <path d="M 93 132 C 91 134, 91 137, 93 139" stroke="#0C2340" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 102 136 C 103 137, 104 136.5, 104 136" stroke="#0C2340" stroke-width="1.4" stroke-linecap="round" fill="none" />
    </g>

    <!-- 3. Riverside Duck -->
    <g id="riverside-duck">
      <!-- Duck Body (Golden Brown Mallard / Farm Duck) -->
      <path
        d="M 112 165 L 115 165 L 116 156 L 120 156 L 121 165 L 124 165 L 125 154 
           C 129 153, 134 149, 136 144 
           C 136 140, 131 139, 126 141 
           C 124 138, 122 134, 121 130 
           C 119 127, 116 127, 114 128 
           L 109 130 
           C 111 132, 113 135, 114 140 
           C 112 146, 110 152, 112 165 Z"
        fill="#A67C52"
        stroke="#0C2340"
        stroke-width="2.2"
        stroke-linejoin="round"
      />
      <!-- Green Neck/Wing Sheen Accent -->
      <path d="M 115 132 C 117 131, 120 131, 121 134 C 119 136, 116 136, 115 134 Z" fill="#2E7D32" />
      <!-- Duck Bill (Orange) -->
      <path d="M 113 130 L 107 131 L 113 133 Z" fill="#F39C12" stroke="#0C2340" stroke-width="1.4" stroke-linejoin="round" />
      <!-- Eye -->
      <circle cx="116" cy="130" r="1.3" fill="#0C2340" />
      <circle cx="116.4" cy="129.6" r="0.5" fill="#FFFFFF" />
      <!-- Wing Contour -->
      <path d="M 118 144 C 124 142, 128 144, 131 149" stroke="#0C2340" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <!-- Upright Tail Feather -->
      <path d="M 134 143 C 136 141, 138 142, 137 145" stroke="#0C2340" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: OFFICIAL BRAND WORDMARK & SUBTITLE  -->
  <!-- ========================================== -->
  <g id="brand-typography">
    <!-- 1. ADA ÇİFTLİĞİ (Bold High-Contrast Serif) -->
    <text
      x="430"
      y="108"
      text-anchor="middle"
      class="serif-title"
      font-size="52"
      font-weight="900"
      fill="#0C2340"
      letter-spacing="1.2"
    >ADA ÇİFTLİĞİ</text>

    <!-- 2. MERİÇ - EDİRNE (Clean Bold Sans-Serif Tracking) -->
    <text
      x="430"
      y="146"
      text-anchor="middle"
      class="sans-sub"
      font-size="20"
      font-weight="800"
      fill="#0C2340"
      letter-spacing="5.5"
    >MERİÇ - EDİRNE</text>
  </g>
</svg>
